<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Test PDF</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        h1 { color: #1a1a2e; margin-bottom: 6px; font-size: 1.6rem; }
        .subtitle { color: #666; margin-bottom: 30px; font-size: 0.95rem; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; color: #333; margin-bottom: 6px; font-size: 0.9rem; }
        input[type="file"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #333;
            background: #fafafa;
        }
        input[type="file"] { padding: 8px; cursor: pointer; }
        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background: #4361ee;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 4px;
        }
        button[type="submit"]:hover { background: #3451d1; }
        button[type="submit"]:disabled { background: #aaa; cursor: not-allowed; }
        .error {
            background: #ffe5e5;
            border: 1px solid #ffb3b3;
            color: #cc0000;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
        .loading {
            display: none;
            text-align: center;
            color: #666;
            margin-top: 14px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Generador de Test PDF</h1>
        <p class="subtitle">Sube un PDF y genera preguntas tipo test automaticamente.</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form action="/generate" method="POST" enctype="multipart/form-data" onsubmit="onSubmit(this)">
            <div class="form-group">
                <label for="pdf">Archivo PDF</label>
                <input type="file" id="pdf" name="pdf" accept=".pdf" required>
            </div>
            <div class="form-group">
                <label for="n">Numero de preguntas</label>
                <input type="number" id="n" name="n" value="5" min="1" max="20" required>
            </div>
            <div class="form-group">
                <label for="difficulty">Dificultad</label>
                <select id="difficulty" name="difficulty">
                    <option value="facil">Facil</option>
                    <option value="media" selected>Media</option>
                    <option value="dificil">Dificil</option>
                </select>
            </div>
            <button type="submit" id="submit-btn">Generar Test</button>
        </form>
        <p class="loading" id="loading">Generando preguntas, esto puede tardar unos segundos...</p>
    </div>

    <script>
        function onSubmit(form) {
            document.getElementById('submit-btn').disabled = true;
            document.getElementById('loading').style.display = 'block';
        }
    </script>
</body>
</html>
